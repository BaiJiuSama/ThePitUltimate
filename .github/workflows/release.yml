name: Build Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build plugin
        run: ./gradlew --no-daemon clean build

      - name: Collect plugin jar
        run: |
          mkdir -p dist
          cp core/build/libs/ThePitUltimate-*.jar dist/
          sha256sum dist/*.jar > dist/SHA256SUMS.txt

      - name: Resolve release metadata
        id: release
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "title=ThePitUltimate ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          {
            echo "body<<EOF"
            echo "Release build for ${GITHUB_REF_NAME}."
            echo
            echo "Commit: ${GITHUB_SHA}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThePitUltimate
          path: dist/*

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_BODY: ${{ steps.release.outputs.body }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          args=()
          if [[ "${PRERELEASE}" == "true" ]]; then
            args+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release edit "${RELEASE_TAG}" \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_BODY}" \
              "${args[@]}"
          else
            gh release create "${RELEASE_TAG}" \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_BODY}" \
              "${args[@]}"
          fi

          gh release upload "${RELEASE_TAG}" dist/* --clobber
